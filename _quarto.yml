quarto-required: ">=1.4.549"

project:
  type: website
  output-dir: docs
  # The Polish site is a separate Quarto project (pl/_quarto.yml). Exclude it here.
  render:
    - "*.qmd"
    - "!pl/"
  resources:
    - CNAME
    - .nojekyll
    - llms.txt
    - llms-full.txt
    - js/**
    - css/**
    - images/**
    - resources/**/*.css
    - resources/**/*.js

