          - text: "Facade remediation cost consultant"
            href: services/facade-remediation-cost-consultant.qmd
          - text: "Drylining takeoff and tender pricing"
            href: services/drylining-takeoff-tender-pricing.qmd
          - text: "Traditional Quantity Takeoff"
            href: services/traditional-quantity-takeoff.qmd
          - text: "Fast-Track Cost Control"
            href: services/fast-track-cost-control.qmd
          - text: "Bid Writing & Bid Management"
            href: services/bid-writing-management.qmd
          - text: "MEP Infrastructure Precision"
            href: services/mep-infrastructure-precision.qmd
          - text: "Multi-Scenario Analysis"
            href: services/multi-scenario-analysis.qmd
          - text: "Comprehensive Reporting"
            href: services/comprehensive-reporting.qmd
          - text: "Construction Data Management"
            href: services/construction-data-management.qmd
          - text: "Construction Logistics"
            href: services/construction-logistics.qmd
          - text: "BREEAM/ESG Cost Modelling"
            href: services/breeam-esg-cost-modeling.qmd
      - text: "Tender pricing"
        href: tender-winning.qmd
      - text: "Resources"
        menu:
          - text: "ROI Calculator"
            href: resources/roi-calculator.qmd
          - text: "Publications"
            href: resources/publications/index.qmd
          - text: "What is BIM 5D Cost Estimation?"
            href: resources/what-is-bim-5d-cost-estimation.qmd
          - text: "---"
          - text: "Residential Development"
            href: industries/residential-development.qmd
          - text: "Remediation"
            href: industries/remediation.qmd
          - text: "Housing Associations"
            href: industries/housing-associations.qmd
