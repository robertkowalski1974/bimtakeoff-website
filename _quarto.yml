  sidebar: false
  
  page-footer:
    background: "#2C2C2C"
    foreground: "#FFFFFF"
    left: |
      © 2026 BIM Takeoff. All rights reserved.
    center: |
      **Services**<br>
      [Quantity takeoff and bills of quantities](/services/automated-quantity-takeoff.html)<br>
