      [Facade and cladding remediation](/industries/remediation.html)<br>
      [Specialist trade packages](/services/trade-specific-specialist-services.html)<br>
      [Poland: kosztorysy and PZP tenders](/pl/)
    right: |
      **Contact**<br>
      [info@bimtakeoff.com](mailto:info@bimtakeoff.com)<br>
      UK [+44 (0) 20 3239 9967](tel:+442032399967)<br>
      PL [+48 508 209 313](tel:+48508209313)<br>
      [Privacy policy](/privacy-policy.html) · [Terms of service](/terms-of-service.html)

