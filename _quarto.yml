          - text: "Warehouses & Logistics"
            href: industries/warehouses-logistics.qmd
          - text: "Data Centres"
            href: industries/data-centers.qmd
          - text: "Commercial Development"
            href: industries/commercial-development.qmd
          - text: "Healthcare & Medical Facilities"
            href: industries/healthcare-medical.qmd
          - text: "Industrial & Manufacturing"
            href: industries/industrial-manufacturing.qmd
          - text: "Infrastructure & Civil Works"
            href: industries/infrastructure-civil.qmd
